aid: diagon
name: Diagon
description: 'Diagon is a California-based industrial equipment sourcing company building
  Albus, an equipment intelligence platform for manufacturing buyers and sellers. Buyers
  search across millions of industrial equipment listings, compare models, specifications,
  pricing and availability, and connect directly with sellers; sellers publish AI-powered
  catalogs, reach qualified buyer demand, and see live equipment searches in real time.
  Diagon indexes manufacturing equipment products, suppliers and service providers,
  bringing hardware, services and financing into a consolidated procurement experience.
  Founded by a team out of Tesla, Bright Machines, Rivian and Snackpass, and backed
  by Anthemis under its data, tech and infrastructure thesis. Diagon publishes no public
  developer API today; its /api surface is an authenticated first-party application
  API (Clerk-based session auth) and is disallowed in robots.txt.'
